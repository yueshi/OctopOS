<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>能力</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--sys-bg);
        --sys-bg: #ffffff;
        --sys-fg: #0f172a;
        --sys-muted: #64748b;
        --sys-line: #e2e8f0;
        --sys-card: #f8fafc;
        --sys-accent: #4f6ef7;
        --sys-ok: #16a34a;
        --sys-warn: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sys-bg: #111827;
          --sys-fg: #e5e7eb;
          --sys-muted: #94a3b8;
          --sys-line: #334155;
          --sys-card: #1e293b;
          --sys-accent: #818cf8;
          --sys-ok: #4ade80;
          --sys-warn: #fbbf24;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--sys-bg);
        color: var(--sys-fg);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
        overflow: auto;
      }
      .page {
        padding: 18px 20px 24px;
        max-width: 980px;
        margin: 0 auto;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 650;
        flex: 1;
      }
      .refresh {
        border: 1px solid var(--sys-line);
        background: var(--sys-bg);
        color: var(--sys-fg);
        border-radius: 8px;
        padding: 6px 11px;
        cursor: pointer;
        font: inherit;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .stat {
        background: var(--sys-card);
        border: 1px solid var(--sys-line);
        border-radius: 11px;
        padding: 12px 13px;
      }
      .stat .label {
        color: var(--sys-muted);
        font-size: 11px;
      }
      .stat .value {
        font-size: 21px;
        font-weight: 650;
        margin-top: 4px;
      }
      .card {
        border: 1px solid var(--sys-line);
        border-radius: 12px;
        margin-top: 14px;
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--sys-line);
      }
      .card-head h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--sys-muted);
        margin: 0;
        font-weight: 600;
        flex: 1;
      }
      .manage {
        border: 1px solid var(--sys-line);
        background: var(--sys-bg);
        color: var(--sys-accent);
        border-radius: 7px;
        padding: 4px 9px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--sys-line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--sys-muted);
        margin-top: 5px;
        flex: 0 0 auto;
      }
      .dot.ok {
        background: var(--sys-ok);
      }
      .dot.off {
        background: var(--sys-warn);
      }
      .row-main {
        flex: 1;
        min-width: 0;
      }
      .row-name {
        font-weight: 550;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-meta {
        color: var(--sys-muted);
        font-size: 11px;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag {
        color: var(--sys-muted);
        border: 1px solid var(--sys-line);
        border-radius: 999px;
        padding: 1px 7px;
        font-size: 10px;
        white-space: nowrap;
      }
      .row-action {
        border: 1px solid var(--sys-line);
        background: var(--sys-bg);
        color: var(--sys-accent);
        border-radius: 7px;
        padding: 3px 8px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        white-space: nowrap;
      }
      .notice {
        margin-top: 10px;
        color: var(--sys-warn);
        font-size: 12px;
      }
      .empty {
        padding: 22px 14px;
        color: var(--sys-muted);
        text-align: center;
      }
      .state {
        padding: 36px 12px;
        text-align: center;
        color: var(--sys-muted);
      }
      .error {
        color: var(--sys-warn);
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid var(--sys-line);
        border-top-color: var(--sys-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 10px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 560px) {
        .page {
          padding: 14px;
        }
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <h1 id="title">能力</h1>
        <button type="button" class="refresh" id="refresh">刷新</button>
      </div>
      <div id="notice" class="notice" hidden></div>
      <div id="content"></div>
    </div>
    <script>
      (function () {
        var locale =
          (window.octopSystem && window.octopSystem.locale) === "en"
            ? "en"
            : "zh";
        var STRINGS = {
          zh: {
            title: "能力",
            skills: "技能",
            tools: "工具",
            enabled: "已启用",
            disabled: "已停用",
            manageSkills: "管理技能",
            manageTools: "管理工具",
            emptySkills: "这个专家还没有安装技能。",
            emptyTools: "没有可显示的工具。",
            error: "加载失败",
            retry: "重试",
            loading: "加载中…",
            builtin: "内置",
            plugin: "插件",
            enable: "启用",
            disable: "停用",
            actionFailed: "操作失败",
          },
          en: {
            title: "Capabilities",
            skills: "Skills",
            tools: "Tools",
            enabled: "Enabled",
            disabled: "Disabled",
            manageSkills: "Manage skills",
            manageTools: "Manage tools",
            emptySkills: "No skills installed for this expert yet.",
            emptyTools: "No tools to show.",
            error: "Could not load capabilities",
            retry: "Retry",
            loading: "Loading…",
            builtin: "Built-in",
            plugin: "Plugin",
            enable: "Enable",
            disable: "Disable",
            actionFailed: "Action failed",
          },
        };
        var text = STRINGS[locale] || STRINGS.zh;
        var state = { loading: false, error: "", skills: [], tools: [] };

        function $(id) {
          return document.getElementById(id);
        }
        function escapeHtml(value) {
          return String(value == null ? "" : value).replace(
            /[&<>"']/g,
            function (ch) {
              return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              }[ch];
            },
          );
        }
        function renderState() {
          var host = $("content");
          if (state.loading) {
            host.innerHTML =
              '<div class="state"><div class="spinner"></div><div>' +
              escapeHtml(text.loading) +
              "</div></div>";
            return;
          }
          if (state.error) {
            host.innerHTML =
              '<div class="state error"><div>' +
              escapeHtml(text.error) +
              '</div><div style="margin-top:8px">' +
              escapeHtml(state.error) +
              '</div><div style="margin-top:12px"><button class="refresh" id="retry">' +
              escapeHtml(text.retry) +
              "</button></div></div>";
            var retry = $("retry");
            if (retry) retry.addEventListener("click", load);
            return;
          }
          render();
        }
        function render() {
          var host = $("content");
          host.innerHTML = "";
          var enabledSkills = state.skills.filter(function (skill) {
            return skill.enabled;
          }).length;
          var enabledTools = state.tools.filter(function (tool) {
            return tool.enabled;
          }).length;
          var disabledTools = state.tools.length - enabledTools;

          var stats = document.createElement("div");
          stats.className = "stats";
          [
            { label: text.skills, value: state.skills.length },
            { label: text.enabled, value: enabledSkills },
            { label: text.tools, value: state.tools.length },
            { label: text.disabled, value: disabledTools },
          ].forEach(function (item) {
            var card = document.createElement("div");
            card.className = "stat";
            var label = document.createElement("div");
            label.className = "label";
            label.textContent = item.label;
            var value = document.createElement("div");
            value.className = "value";
            value.textContent = String(item.value);
            card.appendChild(label);
            card.appendChild(value);
            stats.appendChild(card);
          });
          host.appendChild(stats);

          host.appendChild(
            section({
              title: text.skills,
              manage: text.manageSkills,
              manager: "skills",
              rows: state.skills,
              empty: text.emptySkills,
              row: function (skill) {
                return rowView({
                  on: skill.enabled,
                  name: skill.name || skill.slug,
                  meta: [skill.kind, skill.description]
                    .filter(Boolean)
                    .join(" · "),
                  actionLabel: skill.enabled ? text.disable : text.enable,
                  onAction: function () {
                    toggleSkill(skill);
                  },
                });
              },
            }),
          );

          host.appendChild(
            section({
              title: text.tools,
              manage: text.manageTools,
              manager: "tools",
              rows: state.tools,
              empty: text.emptyTools,
              row: function (tool) {
                return rowView({
                  on: tool.enabled,
                  name: tool.label || tool.name,
                  meta: tool.name,
                  tag: tool.source === "plugin" ? text.plugin : text.builtin,
                });
              },
            }),
          );
        }
        function rowView(options) {
          var row = document.createElement("div");
          row.className = "row";
          var dot = document.createElement("span");
          dot.className = "dot " + (options.on ? "ok" : "off");
          row.appendChild(dot);
          var main = document.createElement("div");
          main.className = "row-main";
          var name = document.createElement("div");
          name.className = "row-name";
          name.textContent = options.name || "—";
          main.appendChild(name);
          if (options.meta) {
            var meta = document.createElement("div");
            meta.className = "row-meta";
            meta.textContent = options.meta;
            main.appendChild(meta);
          }
          row.appendChild(main);
          if (options.tag) {
            var tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = options.tag;
            row.appendChild(tag);
          }
          if (options.actionLabel && options.onAction) {
            var action = document.createElement("button");
            action.type = "button";
            action.className = "row-action";
            action.textContent = options.actionLabel;
            action.addEventListener("click", options.onAction);
            row.appendChild(action);
          }
          return row;
        }
        function section(options) {
          var card = document.createElement("div");
          card.className = "card";
          var head = document.createElement("div");
          head.className = "card-head";
          var title = document.createElement("h2");
          title.textContent = options.title + " (" + options.rows.length + ")";
          head.appendChild(title);
          var manage = document.createElement("button");
          manage.type = "button";
          manage.className = "manage";
          manage.textContent = options.manage;
          manage.addEventListener("click", function () {
            if (window.octopSystem)
              window.octopSystem.openManager(options.manager);
          });
          head.appendChild(manage);
          card.appendChild(head);
          if (!options.rows.length) {
            var empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = options.empty;
            card.appendChild(empty);
          } else {
            options.rows.forEach(function (item) {
              card.appendChild(options.row(item));
            });
          }
          return card;
        }
        function toggleSkill(skill) {
          if (!window.octopSystem || !window.octopSystem.action) return;
          window.octopSystem
            .action("skills.toggle", {
              slug: skill.slug,
              enabled: !skill.enabled,
            })
            .then(function (result) {
              if (!result || !result.cancelled) load();
            })
            .catch(function (error) {
              var notice = $("notice");
              if (notice) {
                notice.textContent =
                  text.actionFailed +
                  ": " +
                  (error && error.message ? error.message : String(error));
                notice.hidden = false;
              }
            });
        }
        function load() {
          if (!window.octopSystem) return;
          var notice = $("notice");
          if (notice) notice.hidden = true;
          state.loading = true;
          state.error = "";
          renderState();
          Promise.allSettled([
            window.octopSystem.query("skills.list", {}),
            window.octopSystem.query("tools.summary", {}),
          ])
            .then(function (results) {
              var failed = results.filter(function (result) {
                return result.status === "rejected";
              });
              if (failed.length === results.length) {
                throw failed[0].reason;
              }
              state.skills =
                results[0].status === "fulfilled"
                  ? results[0].value.skills || []
                  : [];
              state.tools =
                results[1].status === "fulfilled"
                  ? results[1].value.tools || []
                  : [];
              state.loading = false;
              renderState();
            })
            .catch(function (error) {
              state.loading = false;
              state.error =
                error && error.message ? error.message : String(error);
              renderState();
            });
        }
        $("refresh").addEventListener("click", load);
        $("title").textContent = text.title;
        load();
      })();
    </script>
  </body>
</html>
