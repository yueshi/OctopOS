<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>经营看板</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--sys-bg);
        --sys-bg: #ffffff;
        --sys-fg: #0f172a;
        --sys-muted: #64748b;
        --sys-line: #e2e8f0;
        --sys-card: #f8fafc;
        --sys-accent: #4f6ef7;
        --sys-ok: #16a34a;
        --sys-warn: #d97706;
        --sys-danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sys-bg: #111827;
          --sys-fg: #e5e7eb;
          --sys-muted: #94a3b8;
          --sys-line: #334155;
          --sys-card: #1e293b;
          --sys-accent: #818cf8;
          --sys-ok: #4ade80;
          --sys-warn: #fbbf24;
          --sys-danger: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--sys-bg);
        color: var(--sys-fg);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
        overflow: auto;
      }
      .page {
        padding: 18px 20px 24px;
        max-width: 980px;
        margin: 0 auto;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 650;
        flex: 1;
      }
      .refresh {
        border: 1px solid var(--sys-line);
        background: var(--sys-bg);
        color: var(--sys-fg);
        border-radius: 8px;
        padding: 6px 11px;
        cursor: pointer;
        font: inherit;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .stat {
        background: var(--sys-card);
        border: 1px solid var(--sys-line);
        border-radius: 11px;
        padding: 12px 13px;
      }
      .stat .label {
        color: var(--sys-muted);
        font-size: 11px;
      }
      .stat .value {
        font-size: 21px;
        font-weight: 650;
        margin-top: 4px;
      }
      .stat .hint {
        color: var(--sys-muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .stat .value.danger {
        color: var(--sys-danger);
      }
      .card {
        border: 1px solid var(--sys-line);
        border-radius: 12px;
        margin-top: 14px;
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--sys-line);
      }
      .card-head h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--sys-muted);
        margin: 0;
        font-weight: 600;
        flex: 1;
      }
      .link {
        border: 1px solid var(--sys-line);
        background: var(--sys-bg);
        color: var(--sys-accent);
        border-radius: 7px;
        padding: 4px 9px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--sys-line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--sys-muted);
        margin-top: 5px;
        flex: 0 0 auto;
      }
      .dot.ok {
        background: var(--sys-ok);
      }
      .dot.warn {
        background: var(--sys-warn);
      }
      .dot.bad {
        background: var(--sys-danger);
      }
      .row-main {
        flex: 1;
        min-width: 0;
      }
      .row-name {
        font-weight: 550;
      }
      .row-meta {
        color: var(--sys-muted);
        font-size: 11px;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-detail {
        color: var(--sys-danger);
        font-size: 11px;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        padding: 22px 14px;
        color: var(--sys-muted);
        text-align: center;
      }
      .state {
        padding: 36px 12px;
        text-align: center;
        color: var(--sys-muted);
      }
      .error {
        color: var(--sys-danger);
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid var(--sys-line);
        border-top-color: var(--sys-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 10px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .bars {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: 90px 1fr 48px;
        gap: 10px;
        align-items: center;
      }
      .bar-label {
        color: var(--sys-muted);
        font-size: 11px;
      }
      .bar-track {
        height: 8px;
        background: var(--sys-card);
        border: 1px solid var(--sys-line);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--sys-accent);
        border-radius: 999px;
      }
      .bar-value {
        text-align: right;
        font-size: 11px;
        color: var(--sys-muted);
      }
      .budget {
        padding: 12px 14px;
      }
      .budget-track {
        height: 10px;
        background: var(--sys-card);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--sys-line);
      }
      .budget-fill {
        height: 100%;
        background: var(--sys-accent);
      }
      .budget-fill.warn {
        background: var(--sys-warn);
      }
      .budget-fill.danger {
        background: var(--sys-danger);
      }
      .budget-meta {
        display: flex;
        justify-content: space-between;
        color: var(--sys-muted);
        font-size: 11px;
        margin-top: 7px;
        gap: 12px;
      }
      .status-line {
        display: flex;
        gap: 18px;
        padding: 12px 14px;
        flex-wrap: wrap;
        color: var(--sys-muted);
        font-size: 12px;
      }
      .status-line strong {
        color: var(--sys-fg);
        font-weight: 600;
      }
      @media (max-width: 560px) {
        .page {
          padding: 14px;
        }
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <h1 id="title">经营看板</h1>
        <button type="button" class="refresh" id="refresh">刷新</button>
      </div>
      <div id="content"></div>
    </div>
    <script>
      (function () {
        var locale =
          (window.octopSystem && window.octopSystem.locale) === "en"
            ? "en"
            : "zh";
        var STRINGS = {
          zh: {
            title: "经营看板",
            open: "进行中",
            done: "已完成",
            failed: "失败",
            inbox: "待处理",
            tokens: "Token",
            budget: "预算",
            budgetLeft: "{value} 剩余",
            unlimited: "未设置预算上限",
            tasks: "任务",
            inboxTitle: "需要你处理",
            noInbox: "当前没有需要处理的审批或失败任务。",
            status: "运行状态",
            state: "状态",
            channels: "通道",
            cron: "定时任务",
            lastError: "最近错误",
            manage: "打开任务",
            error: "加载失败",
            retry: "重试",
            loading: "加载中…",
            approval: "审批",
            overdue: "逾期",
            budgetKind: "预算",
            unknownState: "未知",
          },
          en: {
            title: "Operations",
            open: "Open",
            done: "Completed",
            failed: "Failed",
            inbox: "Needs you",
            tokens: "Tokens",
            budget: "Budget",
            budgetLeft: "{value} left",
            unlimited: "No budget limit",
            tasks: "Tasks",
            inboxTitle: "Needs your attention",
            noInbox: "No pending approvals or failed tasks right now.",
            status: "Runtime",
            state: "State",
            channels: "Channels",
            cron: "Scheduled jobs",
            lastError: "Last error",
            manage: "Open tasks",
            error: "Could not load operations",
            retry: "Retry",
            loading: "Loading…",
            approval: "Approval",
            overdue: "Overdue",
            budgetKind: "Budget",
            unknownState: "Unknown",
          },
        };
        var text = STRINGS[locale] || STRINGS.zh;
        var state = {
          loading: false,
          error: "",
          metrics: null,
          inbox: null,
          status: null,
        };

        function $(id) {
          return document.getElementById(id);
        }
        function escapeHtml(value) {
          return String(value == null ? "" : value).replace(
            /[&<>"']/g,
            function (ch) {
              return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              }[ch];
            },
          );
        }
        function fmt(template, values) {
          return template.replace(/\{(\w+)\}/g, function (_m, key) {
            return values && key in values ? String(values[key]) : "";
          });
        }
        function fmtNumber(value) {
          try {
            return new Intl.NumberFormat(
              locale === "en" ? "en" : "zh-CN",
            ).format(value || 0);
          } catch (e) {
            return String(value || 0);
          }
        }
        function fmtCompact(value) {
          var n = Number(value) || 0;
          if (n >= 1000000)
            return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
          if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
          return String(Math.round(n));
        }
        function renderState() {
          var host = $("content");
          if (state.loading) {
            host.innerHTML =
              '<div class="state"><div class="spinner"></div><div>' +
              escapeHtml(text.loading) +
              "</div></div>";
            return;
          }
          if (state.error) {
            host.innerHTML =
              '<div class="state error"><div>' +
              escapeHtml(text.error) +
              '</div><div style="margin-top:8px">' +
              escapeHtml(state.error) +
              '</div><div style="margin-top:12px"><button class="refresh" id="retry">' +
              escapeHtml(text.retry) +
              "</button></div></div>";
            var retry = $("retry");
            if (retry) retry.addEventListener("click", load);
            return;
          }
          render();
        }
        function render() {
          var host = $("content");
          host.innerHTML = "";
          var metrics = state.metrics || {};
          var tasks = metrics.tasks || {};
          var usage = metrics.usage || {};
          var budget = metrics.budget || {};
          var inbox = state.inbox || {};
          var status = state.status || {};
          var inboxCount = Object.keys(inbox.counts || {}).reduce(function (
            sum,
            key,
          ) {
            return sum + (inbox.counts[key] || 0);
          }, 0);

          var stats = document.createElement("div");
          stats.className = "stats";
          [
            { label: text.open, value: tasks.open || 0 },
            { label: text.done, value: tasks.done || tasks.completed || 0 },
            {
              label: text.failed,
              value: tasks.failed || 0,
              danger: (tasks.failed || 0) > 0,
            },
            {
              label: text.tokens,
              value: fmtCompact(usage.total_tokens),
              hint: fmtNumber(usage.model_calls) + " calls",
            },
            {
              label: text.budget,
              value: budget.limit ? fmtCompact(budget.remaining) : "—",
              hint: budget.limit
                ? fmt(text.budgetLeft, { value: fmtCompact(budget.remaining) })
                : text.unlimited,
            },
            { label: text.inbox, value: inboxCount, danger: inboxCount > 0 },
          ].forEach(function (item) {
            var card = document.createElement("div");
            card.className = "stat";
            var label = document.createElement("div");
            label.className = "label";
            label.textContent = item.label;
            var value = document.createElement("div");
            value.className = "value" + (item.danger ? " danger" : "");
            value.textContent = String(item.value);
            card.appendChild(label);
            card.appendChild(value);
            if (item.hint) {
              var hint = document.createElement("div");
              hint.className = "hint";
              hint.textContent = item.hint;
              card.appendChild(hint);
            }
            stats.appendChild(card);
          });
          host.appendChild(stats);

          host.appendChild(renderInbox(inbox));
          host.appendChild(renderTasks(tasks, usage));
          host.appendChild(renderBudget(budget));
          host.appendChild(renderStatus(status, inboxCount));
        }
        function renderInbox(inbox) {
          var card = document.createElement("div");
          card.className = "card";
          var head = document.createElement("div");
          head.className = "card-head";
          var title = document.createElement("h2");
          title.textContent = text.inboxTitle;
          head.appendChild(title);
          var manage = document.createElement("button");
          manage.type = "button";
          manage.className = "link";
          manage.textContent = text.manage;
          manage.addEventListener("click", function () {
            if (window.octopSystem) window.octopSystem.openManager("tasks");
          });
          head.appendChild(manage);
          card.appendChild(head);
          var items = (inbox && inbox.items) || [];
          if (!items.length) {
            var empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = text.noInbox;
            card.appendChild(empty);
            return card;
          }
          items.slice(0, 8).forEach(function (item) {
            var row = document.createElement("div");
            row.className = "row";
            var dot = document.createElement("span");
            var cls =
              item.kind === "failed" || item.kind === "budget"
                ? "bad"
                : item.kind === "overdue"
                ? "warn"
                : "ok";
            dot.className = "dot " + cls;
            row.appendChild(dot);
            var main = document.createElement("div");
            main.className = "row-main";
            var name = document.createElement("div");
            name.className = "row-name";
            name.textContent = item.title || item.kind || "—";
            main.appendChild(name);
            var meta = document.createElement("div");
            meta.className = "row-meta";
            var kindLabel =
              item.kind === "approval"
                ? text.approval
                : item.kind === "overdue"
                ? text.overdue
                : item.kind === "budget"
                ? text.budgetKind
                : item.kind;
            meta.textContent = [kindLabel, item.task_id]
              .filter(Boolean)
              .join(" · ");
            main.appendChild(meta);
            if (item.detail) {
              var detail = document.createElement("div");
              detail.className = "row-detail";
              detail.textContent = item.detail;
              main.appendChild(detail);
            }
            row.appendChild(main);
            card.appendChild(row);
          });
          return card;
        }
        function renderTasks(tasks, usage) {
          var card = document.createElement("div");
          card.className = "card";
          var head = document.createElement("div");
          head.className = "card-head";
          var title = document.createElement("h2");
          title.textContent = text.tasks;
          head.appendChild(title);
          card.appendChild(head);
          var names = Object.keys(tasks);
          if (!names.length) {
            var empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "—";
            card.appendChild(empty);
            return card;
          }
          var max =
            Math.max.apply(
              null,
              names.map(function (key) {
                return tasks[key] || 0;
              }),
            ) || 1;
          var bars = document.createElement("div");
          bars.className = "bars";
          names.slice(0, 8).forEach(function (key) {
            var row = document.createElement("div");
            row.className = "bar-row";
            var label = document.createElement("div");
            label.className = "bar-label";
            label.textContent = key;
            var track = document.createElement("div");
            track.className = "bar-track";
            var fill = document.createElement("div");
            fill.className = "bar-fill";
            fill.style.width =
              Math.max(2, Math.round(((tasks[key] || 0) / max) * 100)) + "%";
            track.appendChild(fill);
            var value = document.createElement("div");
            value.className = "bar-value";
            value.textContent = String(tasks[key] || 0);
            row.appendChild(label);
            row.appendChild(track);
            row.appendChild(value);
            bars.appendChild(row);
          });
          card.appendChild(bars);
          return card;
        }
        function renderBudget(budget) {
          var card = document.createElement("div");
          card.className = "card";
          var head = document.createElement("div");
          head.className = "card-head";
          var title = document.createElement("h2");
          title.textContent = text.budget;
          head.appendChild(title);
          card.appendChild(head);
          var body = document.createElement("div");
          body.className = "budget";
          if (!budget.limit) {
            var unlimited = document.createElement("div");
            unlimited.className = "budget-meta";
            unlimited.textContent = text.unlimited;
            body.appendChild(unlimited);
          } else {
            var ratio = Math.max(
              0,
              Math.min(1, (budget.used || 0) / budget.limit),
            );
            var track = document.createElement("div");
            track.className = "budget-track";
            var fill = document.createElement("div");
            fill.className =
              "budget-fill" +
              (ratio >= 0.9 ? " danger" : ratio >= 0.7 ? " warn" : "");
            fill.style.width = Math.round(ratio * 100) + "%";
            track.appendChild(fill);
            body.appendChild(track);
            var meta = document.createElement("div");
            meta.className = "budget-meta";
            var used = document.createElement("span");
            used.textContent =
              fmtCompact(budget.used) + " / " + fmtCompact(budget.limit);
            var left = document.createElement("span");
            left.textContent = fmt(text.budgetLeft, {
              value: fmtCompact(budget.remaining),
            });
            meta.appendChild(used);
            meta.appendChild(left);
            body.appendChild(meta);
          }
          card.appendChild(body);
          return card;
        }
        function renderStatus(status, inboxCount) {
          var card = document.createElement("div");
          card.className = "card";
          var head = document.createElement("div");
          head.className = "card-head";
          var title = document.createElement("h2");
          title.textContent = text.status;
          head.appendChild(title);
          card.appendChild(head);
          var line = document.createElement("div");
          line.className = "status-line";
          [
            [text.state, status.state || text.unknownState],
            [text.channels, String((status.channels || []).length)],
            [text.cron, String((status.cron_jobs || []).length)],
            [text.inbox, String(inboxCount)],
          ].forEach(function (pair) {
            var item = document.createElement("span");
            var strong = document.createElement("strong");
            strong.textContent = pair[1];
            item.textContent = pair[0] + " ";
            item.appendChild(strong);
            line.appendChild(item);
          });
          card.appendChild(line);
          if (status.last_error) {
            var error = document.createElement("div");
            error.className = "row-detail";
            error.style.padding = "0 14px 12px";
            error.textContent = text.lastError + ": " + status.last_error;
            card.appendChild(error);
          }
          return card;
        }
        function load() {
          if (!window.octopSystem) return;
          state.loading = true;
          state.error = "";
          renderState();
          Promise.all([
            window.octopSystem.query("agent.metrics", { window: "last_30d" }),
            window.octopSystem.query("agent.inbox", {}),
            window.octopSystem.query("agent.status", {}),
          ])
            .then(function (results) {
              state.metrics = results[0] || {};
              state.inbox = results[1] || {};
              state.status = results[2] || {};
              state.loading = false;
              renderState();
            })
            .catch(function (error) {
              state.loading = false;
              state.error =
                error && error.message ? error.message : String(error);
              renderState();
            });
        }
        $("refresh").addEventListener("click", load);
        $("title").textContent = text.title;
        load();
      })();
    </script>
  </body>
</html>
