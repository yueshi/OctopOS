<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容审核台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --line: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --green: #15803d;
    --green-bg: #dcfce7;
    --red: #b91c1c;
    --red-bg: #fee2e2;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --blue-bg: #e0e7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  .page { max-width: 1180px; margin: 0 auto; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .4px; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .badge {
    flex: none; padding: 4px 10px; border-radius: 999px;
    background: var(--blue-bg); color: var(--primary-dark); font-size: 12px;
  }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 16px; display: flex; flex-direction: column; gap: 4px;
  }
  .stat-label { color: var(--muted); font-size: 12px; }
  .stat strong { font-size: 23px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  input, select, textarea {
    font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }
  .toolbar input { flex: 1 1 260px; }
  .toolbar select { flex: 0 0 140px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 12px;
  }
  button:disabled { cursor: not-allowed; opacity: .55; }
  .upload-button {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--primary); border: 1px solid var(--primary); color: #fff;
    border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  .upload-button:hover { background: var(--primary-dark); }
  .notice {
    margin-bottom: 14px; padding: 10px 14px; border-radius: 9px;
    background: var(--amber-bg); color: var(--amber); border: 1px solid #fde68a; font-size: 13px;
  }
  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    position: relative; height: 172px; background: #eef0f4;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .thumb .placeholder { color: #9ca3af; font-size: 13px; }
  .status {
    position: absolute; top: 10px; right: 10px; padding: 3px 9px;
    border-radius: 999px; font-size: 12px; font-weight: 600; backdrop-filter: blur(4px);
  }
  .s-pending { background: rgba(255,255,255,.9); color: #374151; }
  .s-approved { background: var(--green-bg); color: var(--green); }
  .s-rejected { background: var(--red-bg); color: var(--red); }
  .body { padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-head h3 { margin: 0; font-size: 15px; line-height: 1.35; word-break: break-word; }
  .notes { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; white-space: pre-wrap; }
  .ai {
    background: #f8f9fb; border: 1px solid #edf0f4; border-radius: 9px;
    padding: 9px 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .ai-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .verdict { font-size: 12px; font-weight: 650; padding: 2px 8px; border-radius: 999px; }
  .v-approve { background: var(--green-bg); color: var(--green); }
  .v-reject { background: var(--red-bg); color: var(--red); }
  .v-needs_review { background: var(--amber-bg); color: var(--amber); }
  .v-empty { background: #e5e7eb; color: #6b7280; }
  .confidence { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ai-summary { margin: 0; font-size: 12px; line-height: 1.55; color: #374151; white-space: pre-wrap; }
  .empty-ai { color: #9ca3af; font-size: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; padding-top: 2px; }
  .actions .ai-button { color: var(--primary-dark); border-color: #c7d2fe; background: #eef2ff; }
  .actions .approve { color: var(--green); border-color: #bbf7d0; }
  .actions .reject { color: var(--red); border-color: #fecaca; }
  .actions .link { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    margin: 0; padding: 9px 18px; border-radius: 999px; z-index: 20;
    background: #111827; color: #fff; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  .toast.error { background: var(--red); }
  .viewer {
    position: fixed; inset: 0; z-index: 30; background: rgba(15,23,42,.78);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .viewer img { max-width: 92vw; max-height: 84vh; border-radius: 10px; background: #fff; }
  .viewer-close {
    position: absolute; top: 18px; right: 22px; color: #fff;
    background: rgba(255,255,255,.16); border-color: transparent; font-size: 16px;
  }
  [hidden] { display: none !important; }
  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    body { padding: 12px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <h1>内容审核台</h1>
      <p class="sub">上传图片素材，AI 先做初审，人工再通过或驳回。</p>
    </div>
    <span class="badge" id="readonly" hidden>只读</span>
  </header>

  <section class="stats">
    <div class="stat"><span class="stat-label">全部素材</span><strong id="stat-total">0</strong></div>
    <div class="stat"><span class="stat-label">待审核</span><strong id="stat-pending">0</strong></div>
    <div class="stat"><span class="stat-label">AI 建议复核</span><strong id="stat-risk">0</strong></div>
    <div class="stat"><span class="stat-label">已通过</span><strong id="stat-approved">0</strong></div>
  </section>

  <p class="notice" id="capability-notice" hidden></p>

  <section class="toolbar">
    <input id="search" placeholder="搜索标题、说明或 AI 摘要">
    <select id="filter-status" aria-label="按审核状态筛选">
      <option value="">全部状态</option>
      <option value="pending">待审核</option>
      <option value="approved">已通过</option>
      <option value="rejected">已驳回</option>
    </select>
    <label class="upload-button" id="upload-label">
      <span>＋ 上传图片</span>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    </label>
  </section>

  <p class="empty" id="empty" hidden>还没有素材，点击「上传图片」开始。</p>
  <section class="gallery" id="gallery"></section>
</div>

<div class="viewer" id="viewer" hidden>
  <button type="button" class="viewer-close" id="viewer-close" aria-label="关闭">✕</button>
  <img id="viewer-image" alt="">
</div>
<p id="toast" class="toast" hidden></p>

<script>
(function () {
  "use strict";

  var STATUS_LABEL = { pending: "待审核", approved: "已通过", rejected: "已驳回" };
  var VERDICT_LABEL = { approve: "建议通过", reject: "建议驳回", needs_review: "建议复核" };
  var TERMINAL = { succeeded: true, failed: true, cancelled: true };
  var records = [];
  var visible = [];
  var assets = {};
  var busy = {};
  var canEdit = false;
  var canAi = false;
  var canUpload = false;
  var canReadAssets = false;

  function $(selector) { return document.querySelector(selector); }
  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function toast(message, isError) {
    var el = $("#toast");
    el.textContent = message;
    el.classList.toggle("error", Boolean(isError));
    el.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.hidden = true; }, 2800);
  }
  function originOf(message) {
    return message && message.message ? message.message : "未知错误";
  }

  function statusBadge(status) {
    var key = status === "approved" || status === "rejected" ? status : "pending";
    return '<span class="status s-' + key + '">' + escapeHtml(STATUS_LABEL[key]) + "</span>";
  }
  function verdictBadge(verdict) {
    var key = verdict === "approve" || verdict === "reject" || verdict === "needs_review"
      ? verdict : "empty";
    var label = VERDICT_LABEL[key] || "尚未初审";
    return '<span class="verdict v-' + key + '">AI · ' + escapeHtml(label) + "</span>";
  }
  function assetUrl(name) {
    return assets[name] || "";
  }

  function render() {
    var query = $("#search").value.trim().toLowerCase();
    var filter = $("#filter-status").value;
    visible = records.filter(function (record) {
      var row = record.values;
      if (filter && row.status !== filter) return false;
      if (!query) return true;
      return [row.title, row.notes, row.ai_summary]
        .join(" ").toLowerCase().indexOf(query) >= 0;
    });

    var pending = 0;
    var approved = 0;
    var risk = 0;
    records.forEach(function (record) {
      var row = record.values;
      if (row.status === "approved") approved += 1;
      else if (row.status !== "rejected") pending += 1;
      if (row.ai_verdict === "reject" || row.ai_verdict === "needs_review") risk += 1;
    });
    $("#stat-total").textContent = String(records.length);
    $("#stat-pending").textContent = String(pending);
    $("#stat-risk").textContent = String(risk);
    $("#stat-approved").textContent = String(approved);
    $("#empty").hidden = visible.length > 0;
    $("#empty").textContent = records.length
      ? "没有符合筛选条件的素材。"
      : "还没有素材，点击「上传图片」开始。";

    $("#gallery").innerHTML = visible.map(function (record, index) {
      var row = record.values;
      var rid = record.meta.row_id;
      var url = assetUrl(row.media);
      var preview = url
        ? '<img src="' + escapeHtml(url) + '" alt="" data-preview="' + index + '">'
        : '<span class="placeholder">' + (row.media ? "图片加载失败" : "无图片") + "</span>";
      var ai = row.ai_summary
        ? '<p class="ai-summary">' + escapeHtml(row.ai_summary) + "</p>"
        : '<span class="empty-ai">尚未进行 AI 初审。</span>';
      var confidence = row.ai_confidence
        ? '<span class="confidence">置信度 ' + escapeHtml(row.ai_confidence) + "</span>"
        : "";
      var running = busy[rid] === true;
      var aiButton = canAi && rid
        ? '<button type="button" class="ai-button" data-action="ai" data-index="' + index + '"'
          + (running ? " disabled" : "") + ">"
          + (running ? "初审中…" : (row.ai_summary ? "重新初审" : "AI 初审")) + "</button>"
        : "";
      var decideButtons = canEdit && rid
        ? '<button type="button" class="approve" data-action="approve" data-index="' + index
          + '"' + (running ? " disabled" : "") + ">通过</button>"
          + '<button type="button" class="reject" data-action="reject" data-index="' + index
          + '"' + (running ? " disabled" : "") + ">驳回</button>"
        : "";
      var assetButton = url
        ? '<button type="button" class="link" data-preview="' + index + '">看原图</button>'
        : "";
      return '<article class="card">'
        + '<div class="thumb">' + preview + statusBadge(row.status) + "</div>"
        + '<div class="body">'
        + '<div class="card-head"><h3>' + escapeHtml(row.title || "未命名素材") + "</h3></div>"
        + (row.notes ? '<p class="notes">' + escapeHtml(row.notes) + "</p>" : "")
        + '<div class="ai"><div class="ai-row">' + verdictBadge(row.ai_verdict)
        + confidence + "</div>" + ai + "</div>"
        + '<div class="actions">' + aiButton + decideButtons + assetButton + "</div>"
        + "</div></article>";
    }).join("");
  }

  async function hydrateAssets() {
    if (!canReadAssets) return;
    var names = {};
    records.forEach(function (record) {
      var name = record.values.media;
      if (name && !Object.prototype.hasOwnProperty.call(assets, name)) names[name] = true;
    });
    await Promise.all(Object.keys(names).map(async function (name) {
      try {
        var result = await octopApp.asset(name);
        assets[name] = result && result.data_url ? result.data_url : "";
      } catch (error) {
        assets[name] = "";
      }
    }));
  }

  async function refresh() {
    try {
      var result = await octopApp.listRows({ limit: 200 });
      var rows = (result && result.rows) || [];
      var meta = (result && result.row_meta) || [];
      records = rows.map(function (values, index) {
        return { values: values, meta: meta[index] || { row_id: "", version: 1 } };
      }).reverse();
      await hydrateAssets();
      render();
    } catch (error) {
      toast("加载失败：" + originOf(error), true);
    }
  }

  function openViewer(url) {
    if (!url) return;
    $("#viewer-image").src = url;
    $("#viewer").hidden = false;
  }

  async function waitForTask(taskId) {
    for (var attempt = 0; attempt < 120; attempt += 1) {
      var task = await octopApp.getTask(taskId);
      if (task && TERMINAL[task.status]) return task;
      await sleep(2000);
    }
    throw new Error("任务等待超时");
  }

  async function runAi(record) {
    if (!record.meta.row_id) return;
    busy[record.meta.row_id] = true;
    render();
    try {
      var task = await octopApp.runTask({
        taskType: "pre_review",
        rowId: record.meta.row_id
      });
      var finished = await waitForTask(task.task_id);
      if (finished.status === "succeeded") {
        toast("AI 初审完成");
      } else {
        toast("AI 初审失败：" + (finished.error || "未知错误"), true);
      }
    } catch (error) {
      toast("AI 初审失败：" + originOf(error), true);
    } finally {
      delete busy[record.meta.row_id];
      await refresh();
    }
  }

  async function decide(record, status) {
    if (!record.meta.row_id) return;
    var values = Object.assign({}, record.values, {
      status: status,
      reviewed_at: new Date().toISOString()
    });
    try {
      await octopApp.updateRow(record.meta.row_id, values, {
        expectedVersion: record.meta.version
      });
      await refresh();
      toast(status === "approved" ? "已通过" : "已驳回");
    } catch (error) {
      toast("保存失败：" + originOf(error), true);
      await refresh();
    }
  }

  async function uploadFiles(files) {
    var uploaded = 0;
    for (var i = 0; i < files.length; i += 1) {
      var file = files[i];
      if (!file || !/^image\/(png|jpeg|webp|gif)$/.test(file.type)) {
        toast("只支持 PNG、JPEG、WebP 或 GIF 图片", true);
        continue;
      }
      var base = String(file.name || "素材").replace(/\.[^.]+$/, "").slice(0, 100) || "素材";
      var suffix = (String(file.name).match(/\.[a-z0-9]+$/i) || [""])[0].toLowerCase();
      var assetName = "review-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + suffix;
      try {
        var upload = await octopApp.upload(new File([file], assetName, { type: file.type }));
        await octopApp.appendRow({
          title: base,
          media: upload.name,
          notes: "",
          status: "pending",
          ai_summary: "",
          ai_verdict: "",
          ai_confidence: "",
          reviewed_at: ""
        });
        uploaded += 1;
      } catch (error) {
        toast("上传失败：" + originOf(error), true);
      }
    }
    if (uploaded) {
      await refresh();
      toast("已上传 " + uploaded + " 张素材");
    }
  }

  $("#search").addEventListener("input", render);
  $("#filter-status").addEventListener("change", render);

  $("#file").addEventListener("change", async function (event) {
    var files = Array.prototype.slice.call(event.target.files || []);
    event.target.value = "";
    if (files.length) await uploadFiles(files);
  });

  $("#gallery").addEventListener("click", function (event) {
    var target = event.target;
    if (!target || target.tagName !== "BUTTON") return;
    var index = Number(target.getAttribute("data-index"));
    var action = target.getAttribute("data-action");
    if (action && visible[index]) {
      if (action === "ai") void runAi(visible[index]);
      else if (action === "approve") void decide(visible[index], "approved");
      else if (action === "reject") void decide(visible[index], "rejected");
    }
  });

  $("#gallery").addEventListener("click", function (event) {
    var target = event.target;
    var preview = target && target.getAttribute ? target.getAttribute("data-preview") : null;
    if (preview == null) return;
    var record = visible[Number(preview)];
    if (record) openViewer(assetUrl(record.values.media));
  });

  $("#viewer-close").addEventListener("click", function () {
    $("#viewer").hidden = true;
    $("#viewer-image").src = "";
  });
  $("#viewer").addEventListener("click", function (event) {
    if (event.target === $("#viewer")) $("#viewer-close").click();
  });

  async function boot() {
    if (typeof octopApp.onDataChange === "function") {
      octopApp.onDataChange(function () { void refresh(); });
    }
    try {
      var me = await octopApp.me();
      var capabilities = (me && me.capabilities) || [];
      canEdit = Boolean(me) && me.permission !== "view";
      canAi = canEdit && capabilities.indexOf("ai.agent_task") >= 0;
      canUpload = capabilities.indexOf("asset.write") >= 0;
      canReadAssets = capabilities.indexOf("asset.read") >= 0;
    } catch (error) {
      toast("无法读取应用权限：" + originOf(error), true);
    }
    if (!canEdit) $("#readonly").hidden = false;
    if (!canUpload) {
      $("#upload-label").hidden = true;
    }
    var notice = $("#capability-notice");
    var missing = [];
    if (canEdit && !canUpload) missing.push("图片上传（asset.write）");
    if (canEdit && !canAi) missing.push("AI 初审（ai.agent_task）");
    if (missing.length) {
      notice.textContent = "当前应用未开启：" + missing.join("、") + "。请让应用所有者在应用设置中开启。";
      notice.hidden = false;
    }
    await refresh();
  }

  boot();
})();
</script>
</body>
</html>
